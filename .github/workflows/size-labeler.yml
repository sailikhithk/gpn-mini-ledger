# W4: Size label — apply based on total lines changed
# actions/labeler@v6 doesn't do size labels natively, so this is a companion workflow.
# Mirrors the DMS pipeline's W4 hygiene workflow.
name: PR Size Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  size-label:
    name: Apply size label
    runs-on: ubuntu-latest
    steps:
      - name: Calculate size and label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            const additions = files.reduce((sum, f) => sum + f.additions, 0);
            const deletions = files.reduce((sum, f) => sum + f.deletions, 0);
            const total = additions + deletions;

            let sizeLabel;
            if (total <= 50)        sizeLabel = 'size:xs';
            else if (total <= 200)  sizeLabel = 'size:s';
            else if (total <= 500)  sizeLabel = 'size:m';
            else if (total <= 1000) sizeLabel = 'size:l';
            else                    sizeLabel = 'size:xl';

            // Remove any existing size: labels
            const sizeLabels = ['size:xs', 'size:s', 'size:m', 'size:l', 'size:xl'];
            const { data: existing } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            for (const label of existing) {
              if (sizeLabels.includes(label.name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name
                }).catch(() => {}); // ignore if already removed
              }
            }

            // Add the new size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [sizeLabel]
            });

            core.info(`PR size: ${total} lines (+${additions} -${deletions}) → ${sizeLabel}`);
