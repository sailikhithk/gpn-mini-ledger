# W1: PR title format validation
# Enforces Conventional Commits style: type(scope): description
# Mirrors the DMS pipeline's W1 hygiene workflow.
name: PR Lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"

          # Conventional Commits: type(scope): description
          # Allowed types: feat, fix, docs, style, refactor, test, chore, ci, build, perf, revert
          pattern='^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|revert)(\([a-z-]+\))?!?: .+'

          if ! echo "$PR_TITLE" | grep -qE "$pattern"; then
            echo "ERROR: PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: type(scope): description"
            echo "  type:    feat|fix|docs|style|refactor|test|chore|ci|build|perf|revert"
            echo "  scope:   optional, lowercase with hyphens (e.g. ledger-core, migration, ci)"
            echo "  !:       optional, for breaking changes"
            echo "  example: feat(ledger-core): add SERIALIZABLE capture with retry on 40001"
            echo ""
            exit 1
          fi

          echo "PR title format: OK"

  pr-description:
    name: Validate PR description (non-empty)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body is not empty
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Strip all whitespace (spaces, tabs, newlines) and check if anything remains
          body_trimmed=$(printf '%s' "$PR_BODY" | tr -d '[:space:]')
          if [ -z "$body_trimmed" ]; then
            echo "ERROR: PR description is empty. Please describe what changed and why."
            exit 1
          fi
          echo "PR description length: ${#body_trimmed} chars (non-whitespace)"
          echo "PR description: OK"
