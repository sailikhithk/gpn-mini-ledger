# Gate 1: Branch naming convention check
# Enforces Conventional Commits branch naming: type/description
# Mirrors the DMS pipeline's branch naming hygiene gate.
name: Branch Naming

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        uses: actions/github-script@v9
        with:
          script: |
            const headBranch = context.payload.pull_request.head.ref;
            const baseBranch = context.payload.pull_request.base.ref;

            // Allowed branch prefixes (Conventional Commits types)
            const allowed = [
              'feat/',
              'feature/',
              'fix/',
              'bugfix/',
              'hotfix/',
              'docs/',
              'style/',
              'refactor/',
              'test/',
              'chore/',
              'ci/',
              'build/',
              'perf/',
              'revert/',
              'release/',
              'dependabot/',   // dependabot branches
              'renovate/',     // renovate branches
            ];

            // Skip for dependabot/renovate branches (they have their own format)
            const isBot = headBranch.startsWith('dependabot/') || headBranch.startsWith('renovate/');

            const matched = allowed.some(prefix => headBranch.startsWith(prefix));

            if (matched || isBot) {
              core.info(`Branch name OK: ${headBranch}`);
              return;
            }

            // Fail the check
            const msg = [
              `ERROR: Branch name \`${headBranch}\` does not follow the naming convention.`,
              '',
              'Expected: `type/<short-description>`',
              '',
              'Allowed types:',
              ...allowed.map(p => `  - \`${p}<description>\``),
              '',
              'Examples:',
              '  - `feat/serializable-capture-retry`',
              '  - `fix/flyway-schema-creation`',
              '  - `docs/changelog-and-learnings`',
              '  - `ci/codeql-workflow`',
              '',
              'See CONTRIBUTING.md → Branching Model.',
            ].join('\n');

            core.setFailed(msg);

            // Also comment on the PR for visibility
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ Branch Naming Convention\n\n${msg}`
            });
