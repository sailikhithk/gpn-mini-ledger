# Auto-request Copilot review on PR open
# Mirrors the DMS pipeline's AI-assisted review phase.
# Copilot review is advisory (non-blocking) — human review is still required.
name: Copilot Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-copilot-review:
    name: Request Copilot code review
    runs-on: ubuntu-latest
    # Only request on PRs to main (not feature→feature PRs)
    if: github.event.pull_request.base.ref == 'main'
    steps:
      - name: Request Copilot review
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.issue.number;

            // Request a Copilot review using the REST API.
            // This triggers GitHub Copilot's code review on the PR diff.
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: ['copilot-pull-request-reviewer']
              });
              core.info(`Copilot review requested on PR #${prNumber}`);
            } catch (err) {
              // If the copilot-pull-request-reviewer bot is not installed,
              // fall back to leaving a comment instructing the reviewer.
              core.warning(`Could not request Copilot reviewer: ${err.message}`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [
                  '## Copilot Review',
                  '',
                  'Automatic Copilot review could not be requested.',
                  'To enable: install the **GitHub Copilot** app on this repository',
                  '(Settings → GitHub Apps → Copilot).',
                  '',
                  'Alternatively, run `gh copilot` or review the diff manually.',
                  '',
                  '> **Reminder (DMS lesson):** Copilot review is advisory. Do not rubber-stamp.',
                  '> Human review is required for business logic, domain correctness, and architecture.'
                ].join('\n')
              });
            }
