# W3: File-based + branch-based PR labeling
# Uses actions/labeler@v6 with .github/labeler.yml config (v5/v6 schema).
# Mirrors the DMS pipeline's W3 hygiene workflow.
name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply file-based + branch-based labels
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true   # remove labels that no longer match
