# Pre-commit hooks for gpn-mini-ledger
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Standard file hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Ensure newline at EOF
      - id: check-yaml
        name: Validate YAML syntax
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
        name: Detect merge conflict markers
      - id: check-case-conflict
        name: Check for case-sensitivity conflicts
      - id: check-added-large-files
        name: Block files >500KB
        args: [--maxkb=500]
      - id: detect-private-key
        name: Detect private keys
      - id: check-executables-have-shebangs
        name: Verify executable scripts have shebangs

  # SQL formatting and linting (Flyway migrations)
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.2.5
    hooks:
      - id: sqlfluff-lint
        name: SQLFluff lint (Flyway migrations)
        args: [--dialect, postgres, --rules, L001,L002,L003,L008,L010,L016,L029,L031,L051]
        files: ^ledger-core/src/main/resources/db/migration/.*\.sql$
      - id: sqlfluff-fix
        name: SQLFluff fix (Flyway migrations)
        args: [--dialect, postgres, --rules, L001,L002,L003,L008,L010,L016,L029,L031,L051]
        files: ^ledger-core/src/main/resources/db/migration/.*\.sql$

# Local hooks for Java/Maven checks
  - repo: local
    hooks:
      - id: mvn-compile
        name: Maven compile check
        entry: ./mvnw -q -pl ledger-core compile
        language: system
        files: ^ledger-core/src/main/.*\.java$
        pass_filenames: false
        stages: [pre-commit]

      - id: env-leak-check
        name: Check for .env / secrets in staged files
        entry: scripts/pre-commit-env-check.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
